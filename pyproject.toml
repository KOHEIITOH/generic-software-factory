[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-software-factory"
version = "0.1.0"
description = "AI-native software development factory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
copilot = [
  "github-copilot-sdk",
]
dev = [
  "httpx>=0.27,<1",
  "pip-audit>=2.9",
  "pyright>=1.1",
  "pytest>=8.0",
  "ruff>=0.14",
]

[project.scripts]
sf = "sf_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
