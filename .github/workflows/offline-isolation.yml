name: Offline isolation

on:
  push:
    branches: [main, "ci/**"]
    paths:
      - "src/sf_factory/docker_execution.py"
      - "src/sf_factory/change_proposal.py"
      - "src/sf_factory/workspace_check.py"
      - "src/sf_factory/issue_development.py"
      - "src/sf_factory/review_automation.py"
      - "src/sf_factory/web_worker.py"
      - "src/sf_factory/web_api.py"
      - "src/sf_factory/operation_control.py"
      - "tests/test_web_jobs.py"
      - "src/sf_factory/issue_execution.py"
      - "tests/test_issue_execution.py"
      - "src/sf_factory/requirement_workflow.py"
      - "src/sf_factory/requirement_plan.py"
      - "src/sf_factory/plan_preview.py"
      - "tests/test_plan_approval.py"
      - "src/sf_factory/requirement_sources.py"
      - "tests/test_requirement_discovery_workflow.py"
      - "tests/test_requirement_workflow.py"
      - "tests/test_review_automation.py"
      - "src/sf_factory/behavioral_check.py"
      - "tests/test_issue_development.py"
      - "tests/test_workspace_check.py"
      - "tests/test_docker_execution.py"
      - "pyproject.toml"
      - ".github/workflows/offline-isolation.yml"
  pull_request:
    paths:
      - "src/sf_factory/docker_execution.py"
      - "src/sf_factory/change_proposal.py"
      - "src/sf_factory/workspace_check.py"
      - "src/sf_factory/issue_development.py"
      - "src/sf_factory/review_automation.py"
      - "src/sf_factory/web_worker.py"
      - "src/sf_factory/web_api.py"
      - "src/sf_factory/operation_control.py"
      - "tests/test_web_jobs.py"
      - "src/sf_factory/issue_execution.py"
      - "tests/test_issue_execution.py"
      - "src/sf_factory/requirement_workflow.py"
      - "src/sf_factory/requirement_plan.py"
      - "src/sf_factory/plan_preview.py"
      - "tests/test_plan_approval.py"
      - "src/sf_factory/requirement_sources.py"
      - "tests/test_requirement_discovery_workflow.py"
      - "tests/test_requirement_workflow.py"
      - "tests/test_review_automation.py"
      - "src/sf_factory/behavioral_check.py"
      - "tests/test_issue_development.py"
      - "tests/test_workspace_check.py"
      - "tests/test_docker_execution.py"
      - "pyproject.toml"
      - ".github/workflows/offline-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SF_TEST_DOCKER_IMAGE: python@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc
      SF_HOST_CANARY: public-isolation-test-canary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install test dependencies
        run: uv sync --extra dev --extra web
      - name: Require actual resource enforcement capability
        run: |
          uv run python - <<'PY'
          from sf_factory.docker_execution import resource_limits_available
          assert resource_limits_available(), "Docker cannot enforce required cgroup limits"
          PY
      - name: Pull fixed trusted test image
        run: |
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS \
            -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock pull "$SF_TEST_DOCKER_IMAGE"
      - name: Exercise required isolation checks
        run: |
          uv run pytest tests/test_docker_execution.py tests/test_workspace_check.py tests/test_issue_development.py tests/test_review_automation.py tests/test_requirement_workflow.py tests/test_requirement_discovery_workflow.py tests/test_plan_approval.py tests/test_web_jobs.py tests/test_issue_execution.py -q \
            -k 'real_offline_filesystem_and_identity or real_timeout_cleans_child_processes or real_output_limit_is_enforced or real_command_failure_is_preserved or real_bounded_input_roundtrip or real_stdin_backpressure_cannot_bypass_timeout or real_input_command_failure_is_not_success or real_candidate_runs_approved_fixture_tests or real_candidate_failure_preserves_actual_test_failure or real_candidate_source_mutation_is_rejected or real_candidate_timeout_is_reaped or real_parent_process_provenance_is_private or real_local_issue_workflow_with_offline_docker or real_docker_same_pr_review_repair or real_docker_requirement_plan_to_serial_prs or real_docker_web_worker_advances_existing_workflow or real_docker_auto_requirement_discovery_to_draft or real_docker_plan_preview_approval_then_draft or real_docker_selected_issue_to_draft' \
            --junitxml="$RUNNER_TEMP/offline-isolation.xml"
      - name: Reject missing or skipped isolation checks
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path(os.environ["RUNNER_TEMP"]) / "offline-isolation.xml"
          cases = ElementTree.parse(report).findall(".//testcase")
          assert len(cases) == 19, "Expected all nineteen required isolation checks"
          assert all(not any(case.findall(tag) for tag in ("failure", "error", "skipped"))
                     for case in cases), "Required isolation checks must execute and pass"
          PY
      - name: Check for leftover execution containers
        if: always()
        run: |
          remaining=$(env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS \
            -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock ps -aq --filter label=sf.execution=offline-v1)
          test -z "$remaining"
