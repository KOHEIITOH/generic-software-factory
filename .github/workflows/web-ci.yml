name: Web UI CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "web/**"
      - "src/sf_factory/web_*.py"
      - "tests/web_operator_fixture.py"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/sf_factory/web_*.py"
      - "tests/web_operator_fixture.py"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install browser fixture dependencies
        run: uv sync --extra dev --extra web
        working-directory: .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise operator browser controls
        run: npm run test:operator
